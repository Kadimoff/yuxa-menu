# Coolify / Traefik üçün. Host portu açılmır: domen Coolify-da bu servisə (8787) bağlanır.
services:
  yuxa-menu:
    build: .
    restart: unless-stopped
    expose:
      - "8787"
    environment:
      NODE_ENV: production
      COOKIE_SECURE: "1"
      # İlk admin: hash `npm run admin:create -- --hash | base64 -w0`. Yalnız admin yoxdursa yaradılır.
      ADMIN_USERNAME: ${ADMIN_USERNAME:-}
      ADMIN_PASSWORD_HASH_B64: ${ADMIN_PASSWORD_HASH_B64:-}
    volumes:
      - yuxa-data:/app/data

volumes:
  yuxa-data:
